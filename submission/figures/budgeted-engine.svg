<svg xmlns="http://www.w3.org/2000/svg" width="535" height="441" viewBox="0 0 535 441"><rect x="0" y="0" width="535" height="441" rx="0" fill="white"/><g font-family="DejaVu Sans, sans-serif"><rect x="18" y="20" width="495" height="77" rx="9" fill="#e9f2fb"/><text x="33" y="47" font-size="22" fill="#192b42" font-weight="700" text-anchor="start">Objective and answer needs</text><text x="33" y="73" font-size="17" fill="#496077" font-weight="400" text-anchor="start">Use new question, retained snapshots, and relevance feedback.</text><line x1="265" y1="97" x2="265" y2="117" stroke="#496077" stroke-width="2"/><path d="M 260 109 L 265 117 L 270 109" fill="none" stroke="#496077" stroke-width="2"/><rect x="18" y="119" width="495" height="77" rx="9" fill="#e9f2fb"/><text x="33" y="146" font-size="22" fill="#192b42" font-weight="700" text-anchor="start">Choose next action</text><text x="33" y="172" font-size="17" fill="#496077" font-weight="400" text-anchor="start">Retrieve locally, read an unread candidate, or search for gaps.</text><line x1="265" y1="196" x2="265" y2="216" stroke="#496077" stroke-width="2"/><path d="M 260 208 L 265 216 L 270 208" fill="none" stroke="#496077" stroke-width="2"/><rect x="18" y="218" width="495" height="77" rx="9" fill="#e9f5f4"/><text x="33" y="245" font-size="22" fill="#192b42" font-weight="700" text-anchor="start">Acquire and index</text><text x="33" y="271" font-size="17" fill="#496077" font-weight="400" text-anchor="start">Validate address and redirects; store exact text and offsets.</text><line x1="265" y1="295" x2="265" y2="315" stroke="#496077" stroke-width="2"/><path d="M 260 307 L 265 315 L 270 307" fill="none" stroke="#496077" stroke-width="2"/><rect x="18" y="317" width="495" height="77" rx="9" fill="#e9f5f4"/><text x="33" y="344" font-size="22" fill="#192b42" font-weight="700" text-anchor="start">Synthesize and revise</text><text x="33" y="370" font-size="17" fill="#496077" font-weight="400" text-anchor="start">Reserve writing resources; publish citations and open needs.</text><text x="21" y="423" font-size="16" fill="#496077" font-weight="400" text-anchor="start">SQLite ledger: reserve before work; record use after dispatch.</text></g></svg>
